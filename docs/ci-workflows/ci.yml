# Skip-Ad CI（v5.5.0）
# 双栈流水线：web（Next.js 演示管理端）+ android（无障碍引擎 JVM 单测）。
# 设计原则：快失败、缓存优先、版本号双端统一门禁（version.ts 为单一数据源）。
#   · web：bun install → prisma generate → tsc --noEmit → lint → 版本一致性
#   · android：JDK 17 + run-tests.sh（纯 javac 零 Gradle 依赖，599 项 JVM 断言）
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Web 端（Next.js + Prisma + TypeScript）
  # 产物链：bun install → prisma generate（tsc 类型依赖）→ tsc --noEmit → lint
  # → 版本号双端统一门禁（version.ts 公式 + dist 防降级）
  # ─────────────────────────────────────────────────────────────
  web:
    name: Web (tsc + lint + 版本门禁)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # bun 缓存：以 bun.lock 为 key，命中时跳过网络下载（约 40s → 3s）
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # prisma client 生成（src/lib/db.ts 导入 @prisma/client，缺失则 tsc 直接报错）
      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Type check (tsc --noEmit)
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      # v5.5.0 模块六：版本号双端统一门禁（公式校验 + 防降级）
      - name: Version sync gate
        run: |
          chmod +x scripts/check-version-sync.sh
          ./scripts/check-version-sync.sh

  # ─────────────────────────────────────────────────────────────
  # Android 端（无障碍引擎 JVM 单元测试）
  # 真实工具链：android-app/run-tests.sh（javac --release 8 → 9 套件）
  # 断言规模：v5.5.0 共 599 项
  #   （小程序防护 / 决策守护 / GKD 订阅 / 回归核心 / 多设备矩阵 /
  #     非主流应用 / 保活自愈 / 功耗治理 / 三源规则治理+新场景+合规守卫）
  # ─────────────────────────────────────────────────────────────
  android:
    name: Android (JVM 599 断言)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 纯 javac 编译：零 Gradle 依赖（构建脚本自动选择 javac，CI 无需 ECJ）
      - name: Run JVM unit tests
        working-directory: android-app
        run: |
          chmod +x run-tests.sh
          ./run-tests.sh

      # 单测报告归档（失败时上传，供 PR 排障）
      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-logs
          path: android-app/build-tests/*.log
          if-no-files-found: ignore
          retention-days: 7
