# Skip-Ad · APK 构建（v8.0.0 起用）
# 手动触发：Actions → Build APK → Run workflow（可选 versionCode/versionName）。
# 工具链与本地一致：aapt2 + javac/ECJ + d8 + zipalign + apksigner（复用仓库 build.sh——
# 内置 secret-scan / app.js 符号闸 / versionCode 防降级守卫，失败即硬失败，绝不跳过检查伪造成功）。
# 签名：仓库内 keystore/adshield.keystore（docs/SECURITY.md R2 知情接受现状）；
#   如配置了 Secrets KS_PASS/KEY_PASS 则优先注入（build.sh 原生支持）。
name: Build APK

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode（须大于 dist 历史最大——80000）"
        required: true
        default: "80000"
      versionName:
        description: "versionName（须与 src/lib/version.ts 一致）"
        required: true
        default: "8.0.0"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Android APK（aapt2 + javac/ECJ + d8 + apksigner）
    runs-on: ubuntu-latest
    env:
      VC: ${{ inputs.versionCode }}
      VN: ${{ inputs.versionName }}
      KS_PASS: ${{ secrets.KS_PASS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK build-tools 34 + platform 34
        run: |
          yes | sdkmanager --install "build-tools;34.0.0" "platforms;android-34" >/dev/null
          echo "ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_ENV"
          echo "ANDROID_PLATFORM_JAR=$ANDROID_HOME/platforms/android-34/android.jar" >> "$GITHUB_ENV"

      - name: Build（./build.sh——六步流水线 + 三道前置闸）
        working-directory: android-app
        run: |
          set -euo pipefail
          # 同版本重建：临时挪开 dist 中同版本历史包，避免防降级守卫误拒
          # （守卫只防真实降级发布；对其他版本号仍然全程在岗）
          if [ -f "dist/adshield-v${VN}.apk" ]; then
            mkdir -p /tmp/dist-aside
            mv "dist/adshield-v${VN}.apk" /tmp/dist-aside/
            [ -f "dist/adshield-v${VN}.apk.idsig" ] && mv "dist/adshield-v${VN}.apk.idsig" /tmp/dist-aside/ || true
          fi
          bash build.sh "$VC" "$VN"

      - name: Verify APK（存在性/签名/包名/版本/SDK/大小/SHA-256——任一不符即失败）
        working-directory: android-app
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK="dist/adshield-v${VN}.apk"
          if [ ! -f "$APK" ]; then echo "::error::APK 未生成：$APK"; exit 1; fi
          "$BT/apksigner" verify "$APK" || { echo "::error::签名验证失败"; exit 1; }
          "$BT/apksigner" verify --print-certs "$APK" | sed -n '1,4p'
          BADGING="$("$BT/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -E "^package|^sdkVersion|^targetSdk"
          echo "$BADGING" | grep -q "versionCode='${VC}'" || { echo "::error::APK versionCode 与输入不符"; exit 1; }
          echo "$BADGING" | grep -q "versionName='${VN}'" || { echo "::error::APK versionName 与输入不符"; exit 1; }
          echo "size = $(stat -c%s "$APK") bytes"
          sha256sum "$APK" | tee "dist/adshield-v${VN}.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adshield-v${{ inputs.versionName }}-apk
          path: |
            android-app/dist/adshield-v${{ inputs.versionName }}.apk
            android-app/dist/adshield-v${{ inputs.versionName }}.apk.idsig
            android-app/dist/adshield-v${{ inputs.versionName }}.apk.sha256
          if-no-files-found: error
