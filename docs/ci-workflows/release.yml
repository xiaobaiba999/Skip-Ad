# Skip-Ad Release（v5.5.0）
# tag v* 触发：版本双端统一门禁 → 全量 JVM 测试 → Android 签名构建（build.sh
# 真实工具链）→ conventional commits 更新日志 → GitHub Release 附 APK →
# Web 端构建自检。另含每周规则与学习数据自动同步 job。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Android 签名构建（android-app/build.sh：aapt2 + javac + d8 + apksigner）
  # 签名：开源演示项目的 keystore 已随仓库分发（android-app/keystore/）；
  # 正式分发请自行更换 keystore 并改用 secrets 注入（文末注释）。
  # ─────────────────────────────────────────────────────────────
  android-release:
    name: Android release (signed APK)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 更新日志需要完整提交历史

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # v5.5.0 模块六：版本号双端统一门禁——tag 与 src/lib/version.ts 必须
      # 一致（单一数据源），versionCode 公式 major*10000+minor*100+patch
      # 由脚本校验后推导（v5.3.0「无法降级安装」事故防复发）
      - name: Version sync gate (tag ↔ version.ts)
        run: |
          chmod +x scripts/check-version-sync.sh
          ./scripts/check-version-sync.sh "${{ steps.version.outputs.version }}"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK：build-tools 34.0.0（aapt2/d8/zipalign/apksigner）+
      # platform android-34（android.jar）——build.sh 经环境变量接管路径
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager "build-tools;34.0.0" "platforms;android-34" >/dev/null
          SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_BUILD_TOOLS=$SDK_ROOT/build-tools/34.0.0" >> "$GITHUB_ENV"
          echo "ANDROID_PLATFORM_JAR=$SDK_ROOT/platforms/android-34/android.jar" >> "$GITHUB_ENV"

      # 发布前全量测试门禁（599 项 JVM 断言，失败即中止发布）
      - name: Full JVM test gate
        working-directory: android-app
        run: |
          chmod +x run-tests.sh
          ./run-tests.sh

      # versionCode 推导：major*10000 + minor*100 + patch（与 version.ts 同公式）
      - name: Derive versionCode
        id: vcode
        run: |
          V="${{ steps.version.outputs.version }}"
          MAJOR="${V%%.*}"; REST="${V#*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          VC=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "code=$VC" >> "$GITHUB_OUTPUT"
          echo "▶ 发布 v$V (versionCode $VC)"

      # 签名构建：keystore 随仓库（开源演示项目）；正式分发建议：
      #   1. 更换 keystore 后从 build.sh 移除硬编码密码
      #   2. 用 secrets.ANDROID_KEYSTORE_BASE64 解码注入 + 环境变量传密码
      - name: Build signed release APK
        working-directory: android-app
        env:
          ANDROID_JDK: ${{ env.JAVA_HOME }}
        run: |
          chmod +x build.sh
          ./build.sh "${{ steps.vcode.outputs.code }}" "${{ steps.version.outputs.version }}" \
            "dist/adshield-v${{ steps.version.outputs.version }}.apk"

      # 更新日志：conventional commits 分组（feat/fix/perf/chore → 新特性/修复/性能/其他）
      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          RANGE=""
          if [ -n "$PREV_TAG" ]; then RANGE="$PREV_TAG..HEAD"; fi

          # 分组渲染（空组输出占位行，杜绝 grep 空管道导致的空标题）
          section() {
            local title="$1" pattern="$2"
            echo ""
            echo "### $title"
            local out
            out=$(git log $RANGE --pretty=format:'%s' 2>/dev/null | grep -E "$pattern" || true)
            if [ -z "$out" ]; then
              echo "-（本组无提交）"
            else
              echo "$out"
            fi
          }

          {
            echo "## Skip-Ad v${{ steps.version.outputs.version }}"
            echo ""
            echo "> Android 直接覆盖安装（同签名）；检查更新走 App「我的 → 检查更新」页内直下。"
            section "新特性 (feat)"   '^feat(\(.+\))?!?:'
            section "修复 (fix)"      '^fix(\(.+\))?!?:'
            section "性能 (perf)"     '^perf(\(.+\))?:'
            section "其他 (chore/docs/style/refactor/test)" '^(chore|docs|style|refactor|test)(\(.+\))?:'
            echo ""
            echo "---"
            echo "**完整变更**：[\`v${{ steps.version.outputs.version }}\`](https://github.com/${{ github.repository }}/releases)"
          } > CHANGELOG.md
          cat CHANGELOG.md

      # GitHub Release：附 APK + 更新日志（Web 端「检查更新」接口即读此处）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Skip-Ad v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: android-app/dist/adshield-v${{ steps.version.outputs.version }}.apk
          generate_release_notes: false

  # ─────────────────────────────────────────────────────────────
  # Web 端同步（Vercel / 静态部署）
  # ─────────────────────────────────────────────────────────────
  web-sync:
    name: Web sync (Vercel)
    runs-on: ubuntu-latest
    needs: android-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 方案 A（默认）：Vercel Git 集成自动部署——push tag 后 Vercel 自拉自建，
      # 本 job 仅做构建自检，保证 tag 指向的 Web 端代码可构建。
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install and build check
        run: |
          bun install --frozen-lockfile
          bunx prisma generate
          bunx tsc --noEmit
          bun run lint

      # 方案 B（可选，取消注释并配置 secrets.VERCEL_TOKEN / VERCEL_ORG_ID /
      # VERCEL_PROJECT_ID 后启用 CLI 直推，适合非 Git 集成托管）：
      #
      # - name: Deploy to Vercel
      #   run: |
      #     bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      #     bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      #     bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
      #
      # 方案 C（静态导出托管，适合纯演示端）：
      # - run: bun run build && cp -r .next/standalone .next/static public dist/
      # - uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: dist

# ─────────────────────────────────────────────────────────────
# 规则与学习数据自动同步（v5.5.0 模块六）
# 放在 ci.yml 的 schedule 触发更合适；此文件仅 tag 触发，故同步 job 的
# 正式定义见 docs/ci-workflows/sync.yml（每周一 02:00 东八区）。
# ─────────────────────────────────────────────────────────────
