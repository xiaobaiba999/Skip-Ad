# ── wrangler 配置样例（v8.2.0）────────────────────────────────
# ⚠ 真实部署在私有仓 Skip-Ad-Log-Upload 的 wrangler.toml 上【追加】——本文件
#   仅文档化本模块所需的环境绑定；不要复制整个文件覆盖现有配置。
#
# name = "skip-ad-log-relay"          # 现有 Worker 名（不变）
# main = "src/index.ts"               # 现有入口（update.ts 经其接线）
# compatibility_date = "2024-09-01"   # 沿用现有值
#
# [vars] —— 本模块零必需变量：
#   REPO        目标仓库（默认 "xiaobaiba999/Skip-Ad"）
#   CACHE_TTL_S 缓存秒（默认 600；clamp 300~900）
#
# Secrets（wrangler secret put / Dashboard 配置；全部可选——缺省回退匿名+缓存）：
#   APP_ID            = "5859168"        # GitHub App ID
#   APP_PRIVATE_KEY   = <PEM 全文>       # App 私钥（PKCS#1/PKCS#8 均可）
#   INSTALLATION_ID   = "184262217"      # Installation ID
#   GH_TOKEN          = <留空>           # 运维/测试直通令牌（生产禁用）
#
# 详见 DEPLOY.md（接线分支 + 验证清单 + 回滚）。
