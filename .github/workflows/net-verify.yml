# 网络链路端到端验证（network-link-verify）——v7.9.9 网络专项
# ═══════════════════════════════════════════════════════════════════
# 背景（2026-11 小米 15 Pro · Android 17 真机反馈）：
#   ① 检查更新「网络连接错误」——raw.githubusercontent.com 主源国内
#      DNS 污染/TCP 阻断 + github.io 备用源 Pages 未启用（404）双源全灭；
#   ② 日志上传「上传超时」——workers.dev 端点国内可达性未知（沙箱网络
#      受限无法直接验证），服务端源码仓已不存在（无法从代码确认状态）。
#
# 本工作流在 GitHub Actions runner（无墙网络）执行真实 HTTP 请求，逐链路
# 记录状态码/响应摘要/耗时——区分「服务端故障」与「用户侧网络阻断」：
#   · 清单五源（raw 主源 + jsDelivr 四接入点）一致性与真实可达性；
#   · 日志中转 Worker /healthz 健康检查（在线/DNS/路由/鉴权配置）；
#   · Worker /api/logs/receive 真实上传（九键契约 + X-Skip-Ad-Client 头）
#     → GitHub Issue 真实创建核验（gh api 读取确认）；
#   · 同 batchId 幂等重试（绝不二建 Issue——冻结批次协议的服务端面）；
#   · 测试 Issue 清理（关闭 + 备注说明，保持公开仓整洁）。
#
# 诚实口径：runner 在海外无墙网络——本验证证明「服务端链路是否健康」，
# 不能证明「中国大陆网络是否可达 workers.dev」（该结论由真机反馈与
# DNS 污染实测共同支撑，见 docs/CHANGELOG.md v7.9.9 节）。
# 凭据：仅 Actions 自带 GITHUB_TOKEN（issues:write——E2E 测试 Issue 的
# 备注与关闭清理）；零 PAT/私钥。
name: network-link-verify

on:
  workflow_dispatch: {}
  schedule:
    # 每周一 02:30 UTC 例行链路体检（无人值守健康面——Worker 下线可及时发现）
    - cron: '30 2 * * 1'

permissions:
  issues: write   # E2E 测试 Issue 备注与关闭清理

concurrency:
  group: network-link-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 基线（main 分支 latest.json 权威内容）
        id: base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 基线从 GitHub Contents API 读取 main 分支真实清单（与 CDN 无关的权威源）
          gh api "repos/${GITHUB_REPOSITORY}/contents/update/latest.json" \
            --jq '.content' | base64 -d > /tmp/baseline.json
          BASE_VC=$(jq -r '.versionCode' /tmp/baseline.json)
          BASE_SHA=$(jq -r '.apkSha256' /tmp/baseline.json)
          BASE_TAG=$(jq -r '.releaseTag' /tmp/baseline.json)
          echo "vc=$BASE_VC" >> "$GITHUB_OUTPUT"
          echo "sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$BASE_TAG" >> "$GITHUB_OUTPUT"
          echo "基线：$BASE_TAG / versionCode=$BASE_VC / SHA256=${BASE_SHA:0:16}…"

      - name: 1/5 清单五源核验（raw 主源 + jsDelivr 四接入点）
        id: manifest
        run: |
          set -uo pipefail
          EXPECT_VC="${{ steps.base.outputs.vc }}"
          EXPECT_SHA="${{ steps.base.outputs.sha }}"
          OK=0; TOTAL=0; DETAILS=""
          for URL in \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/update/latest.json" \
            "https://cdn.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/update/latest.json" \
            "https://fastly.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/update/latest.json" \
            "https://gcore.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/update/latest.json" \
            "https://testingcf.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/update/latest.json"; do
            TOTAL=$((TOTAL+1))
            T0=$(date +%s%3N)
            BODY=$(curl -fsSL --max-time 30 "$URL" 2>/dev/null || true)
            T1=$(date +%s%3N)
            MS=$((T1-T0))
            VC=$(echo "$BODY" | jq -r '.versionCode // empty' 2>/dev/null || true)
            SHA=$(echo "$BODY" | jq -r '.apkSha256 // empty' 2>/dev/null || true)
            if [ "$VC" = "$EXPECT_VC" ] && [ "$SHA" = "$EXPECT_SHA" ]; then
              OK=$((OK+1))
              DETAILS="${DETAILS}✓ ${URL}（${MS}ms · versionCode=$VC）\n"
            else
              DETAILS="${DETAILS}✗ ${URL}（${MS}ms · versionCode=${VC:-无响应}）\n"
            fi
          done
          echo -e "$DETAILS"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          if [ "$OK" -eq 0 ]; then
            echo "✗ 清单五源全部不可达/不一致——更新检查链路服务端故障"
            exit 1
          fi
          echo "清单源生效：$OK/$TOTAL"

      - name: 2/5 Worker 健康检查（/healthz）
        id: healthz
        if: always()   # 与清单检查独立——Worker 诊断不因清单源故障而跳过
        run: |
          set -uo pipefail
          HEALTHZ="https://skip-ad-log-relay.2927609408.workers.dev/healthz"
          T0=$(date +%s%3N)
          BODY=$(curl -sS --max-time 30 -w '\n%{http_code}' "$HEALTHZ" 2>&1 || echo "CURL_FAIL")
          T1=$(date +%s%3N)
          CODE=$(echo "$BODY" | tail -1)
          RESP=$(echo "$BODY" | head -n -1 | head -c 400)
          echo "GET $HEALTHZ → HTTP $CODE（$((T1-T0))ms）"
          echo "响应摘要：$RESP"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "200" ]; then
            echo "✓ Worker 在线且 /healthz 正常"
            exit 0
          fi
          echo "✗ Worker /healthz 异常（HTTP $CODE）——服务端故障或已下线"
          exit 1

      - name: 3/5 Worker 真实上传 E2E（POST /api/logs/receive → GitHub Issue）
        id: upload
        if: always()   # /healthz 异常也尝试真实上传（完整诊断链）
        run: |
          set -uo pipefail
          RELAY="https://skip-ad-log-relay.2927609408.workers.dev/api/logs/receive"
          # 九键契约载荷（与 LogUploader.buildBody 一字不差的结构）：
          # batchId/installInstanceId 每次运行新生成 UUID v4（E2E 独立测试
          # 实例——不占用任何真实安装的 24h 滑窗额度）；事件为 LogEvents
          # 白名单契约内的合成事件（STATS + AD_TASK，零真实用户数据）。
          BATCH_ID=$(python3 -c "import uuid; print(uuid.uuid4())")
          INSTALL_ID=$(python3 -c "import uuid; print(uuid.uuid4())")
          CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          NOW_MS=$(date +%s000)
          cat > /tmp/payload.json <<EOF
          {
            "schemaVersion": 1,
            "batchId": "$BATCH_ID",
            "installInstanceId": "$INSTALL_ID",
            "appVersion": "7.9.9",
            "versionCode": 79900,
            "androidVersion": "17",
            "createdAt": "$CREATED",
            "privacyFilterVersion": 1,
            "events": [
              {"type":"STATS","at":$NOW_MS,"errClass":"DEV_E2E.NETVERIFY","gkdConsulted":1,"gkdMatched":1,"gkdCandidateAccepted":1,"gkdClicked":1,"gkdVerifiedSuccess":1,"gkdClickFail":0,"gkdFalseClick":0,"gkdBlocked":0,"taskSuccess":1,"taskMiss":0,"taskUnknown":0},
              {"type":"AD_TASK","at":$NOW_MS,"pkg":"com.zai.adshield.e2e","activity":".NetworkLinkVerify","taskState":"SUCCESS","outcome":"VERIFIED_SUCCESS","retryCount":0,"scanCount":1,"generation":1}
            ]
          }
          EOF
          cp /tmp/payload.json /tmp/payload-retry.json   # 同 batchId 幂等重试字节级复用
          echo "batchId=$BATCH_ID" >> "$GITHUB_OUTPUT"
          T0=$(date +%s%3N)
          RESP=$(curl -sS --max-time 60 -w '\n%{http_code}' \
            -X POST "$RELAY" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Accept: application/json" \
            -H "X-Skip-Ad-Client: com.zai.adshield" \
            --data-binary @/tmp/payload.json 2>&1 || echo "CURL_FAIL")
          T1=$(date +%s%3N)
          CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "POST $RELAY → HTTP $CODE（$((T1-T0))ms）"
          echo "响应摘要：$(echo "$BODY" | head -c 500)"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
          ISSUE=$(echo "$BODY" | jq -r '.issueNumber // empty' 2>/dev/null || true)
          OK_FLAG=$(echo "$BODY" | jq -r '.ok // empty' 2>/dev/null || true)
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "200" ] && [ "$OK_FLAG" = "true" ] && [ -n "$ISSUE" ]; then
            echo "✓ Worker 接受上传并返回 issueNumber=$ISSUE"
            exit 0
          fi
          echo "✗ Worker 上传未成功（HTTP $CODE · ok=$OK_FLAG · issue=$ISSUE）"
          echo "  分类：HTTP $CODE 非 200 → 服务端拒绝/网关异常；200 但 ok≠true → 契约/限流响应"
          exit 1

      - name: 4/5 同 batchId 幂等/恢复重试（绝不二建 Issue）
        id: idem
        if: always() && steps.upload.outputs.code != ''
        run: |
          set -uo pipefail
          RELAY="https://skip-ad-log-relay.2927609408.workers.dev/api/logs/receive"
          EXPECT_ISSUE="${{ steps.upload.outputs.issue }}"
          FIRST_CODE="${{ steps.upload.outputs.code }}"
          # 服务端 503 TEMPORARY_ERROR 携带 retryAfter（批次已保留待恢复）——
          # 按服务端口径等待后同 batchId 重试（真实恢复路径，绝不换号）
          WAIT=$(echo '${{ steps.upload.outputs.body }}' | jq -r '.retryAfter // 60' 2>/dev/null || echo 60)
          case "$WAIT" in (*[!0-9]*|"") WAIT=60;; esac
          [ "$WAIT" -gt 120 ] && WAIT=120
          echo "首次结果：HTTP $FIRST_CODE（issue=${EXPECT_ISSUE:-无}）→ 等待 ${WAIT}s 后同 batchId 重试…"
          sleep "$WAIT"
          T0=$(date +%s%3N)
          RESP=$(curl -sS --max-time 60 -w '\n%{http_code}' \
            -X POST "$RELAY" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Accept: application/json" \
            -H "X-Skip-Ad-Client: com.zai.adshield" \
            --data-binary @/tmp/payload-retry.json 2>&1 || echo "CURL_FAIL")
          T1=$(date +%s%3N)
          CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -n -1)
          echo "POST（同 batchId 重试）→ HTTP $CODE（$((T1-T0))ms）"
          echo "响应摘要：$(echo "$BODY" | head -c 500)"
          ISSUE2=$(echo "$BODY" | jq -r '.issueNumber // empty' 2>/dev/null || true)
          CODE2=$(echo "$BODY" | jq -r '.code // empty' 2>/dev/null || true)
          OK2=$(echo "$BODY" | jq -r '.ok // empty' 2>/dev/null || true)
          if [ -n "$EXPECT_ISSUE" ] && [ "$ISSUE2" = "$EXPECT_ISSUE" ]; then
            echo "✓ 幂等命中：同 batchId 返回原 Issue #$EXPECT_ISSUE（未二建）"
            echo "issue2=$ISSUE2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE2" = "ALREADY_ACCEPTED" ]; then
            echo "✓ 幂等命中：ALREADY_ACCEPTED（原批次已接受——重试安全）"
            echo "issue2=$ISSUE2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 首次 503（结果未知）→ 重试成功 = 恢复路径生效（同 batchId 建立原 Issue）
          if [ "$FIRST_CODE" != "200" ] && [ "$CODE" = "200" ] && [ "$OK2" = "true" ] && [ -n "$ISSUE2" ]; then
            echo "✓ 恢复路径生效：首次 $FIRST_CODE（结果未知）→ 同 batchId 重试建立 Issue #$ISSUE2（未二建未换号）"
            echo "issue2=$ISSUE2" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" = "503" ] || [ "$CODE2" = "TEMPORARY_ERROR" ]; then
            echo "✗ Worker→GitHub 上游持续失败（$FIRST_CODE → $CODE，TEMPORARY_ERROR）——服务端 Issue 创建链路故障（与客户端网络无关）"
            exit 1
          fi
          echo "✗ 幂等/恢复异常：重试 HTTP $CODE · code=$CODE2 · issue=$ISSUE2（期望 ${EXPECT_ISSUE:-首次成功编号}）"
          exit 1

      - name: 5/5 GitHub Issue 真实存在核验 + E2E 测试清理
        if: always() && (steps.upload.outputs.issue != '' || steps.idem.outputs.issue2 != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          ISSUE="${{ steps.upload.outputs.issue }}"
          if [ -z "$ISSUE" ]; then ISSUE="${{ steps.idem.outputs.issue2 }}"; fi
          BATCH="${{ steps.upload.outputs.batchId }}"
          echo "核验 Issue #$ISSUE 在公开仓真实存在…"
          if gh api "repos/${GITHUB_REPOSITORY}/issues/$ISSUE" > /tmp/issue.json 2>/dev/null; then
            TITLE=$(jq -r '.title' /tmp/issue.json)
            STATE=$(jq -r '.state' /tmp/issue.json)
            echo "✓ Issue #$ISSUE 真实存在：$TITLE（state=$STATE）"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/$ISSUE/comments" \
              -f body="端到端链路验证测试批次（network-link-verify 工作流）：本 Issue 由日志中转服务按测试载荷 batchId \`$BATCH\` 创建，用于验证 Worker→GitHub Issues 链路与 batchId 幂等协议。无真实用户数据，验证完成后自动关闭。" > /dev/null || true
            if [ "$STATE" = "open" ]; then
              gh issue close "$ISSUE" --repo "${GITHUB_REPOSITORY}" --reason completed \
                --comment "E2E 验证完成，自动清理。" || true
              echo "✓ 测试 Issue 已关闭"
            fi
          else
            echo "⚠ Issue #$ISSUE 未在公开仓找到（Worker 可能写入其他目标仓）——编号由服务端确认但 URL 无法核实（客户端 verifyIssueUrl 同语义：只显示编号不造链接）"
          fi

      - name: 结果汇总
        if: always()
        run: |
          echo "══════════ network-link-verify 结果 ══════════"
          echo "清单基线   : ${{ steps.base.outputs.tag }} / versionCode=${{ steps.base.outputs.vc }} / SHA256=${{ steps.base.outputs.sha }}"
          echo "清单五源   : ${{ steps.manifest.outputs.ok }}/${{ steps.manifest.outputs.total }} 生效"
          echo "Worker 健康: HTTP ${{ steps.healthz.outputs.code }}"
          echo "真实上传   : HTTP ${{ steps.upload.outputs.code }} → Issue #${{ steps.upload.outputs.issue || '未创建' }}"
          echo "幂等/恢复   : ${{ steps.idem.conclusion }}（重试 Issue #${{ steps.idem.outputs.issue2 || '—' }}；conclusion=success = 同 batchId 复用原 Issue 未二建/恢复路径生效）"
          echo "──────────────────────────────────────────────"
          echo "注：runner 为海外无墙网络——本结果证明服务端链路健康度；"
          echo "    中国大陆网络对 workers.dev 的可达性以真机反馈为准（v7.9.9"
          echo "    客户端已按阶段化超时分类如实提示，绝不伪造成功）。"
          echo "══════════════════════════════════════════════"
